<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tâches – Coordination support IT</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14284b;--mut:#64748b;--bg:#f1f5fb;--line:#dde5f1;--brand:#0f5fd7}
*{box-sizing:border-box}
body{margin:0;font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header{background:linear-gradient(115deg,#0b3d91,#0f5fd7 50%,#12b5c9);color:#fff;padding:14px 0 18px}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header a.back{color:#fff;opacity:.85;text-decoration:none;font-size:.85rem}
h1{font-size:1.5rem;margin:0;font-weight:800;letter-spacing:-.01em;flex:1}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;background:var(--brand);color:#fff}
.btn.w{background:#fff;color:#0b3d91}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line)}.btn.red{background:#fff;color:#c0392b;border:2px solid #f3c6c0}
.btn.sm{padding:5px 12px;font-size:.84rem}.btn:hover{filter:brightness(1.08)}
:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.menu{position:relative}.menu summary{list-style:none;cursor:pointer;color:#fff;font-weight:600;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.18)}
.menu summary::-webkit-details-marker{display:none}
.menu div{position:absolute;right:0;top:44px;background:#fff;border-radius:12px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:10;min-width:170px}
.menu div button{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--ink)}
.menu div button:hover{background:var(--bg)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-top:18px;overflow-x:auto}
.tab{--c:var(--brand);border:0;background:none;font:inherit;font-weight:700;color:var(--mut);padding:10px 16px;cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab small{margin-left:6px;background:var(--line);border-radius:99px;padding:0 8px;font-size:.78rem}
.tab:hover{color:var(--ink)}
.tab[aria-pressed=true]{color:var(--c);border-bottom-color:var(--c)}
.tab[aria-pressed=true] small{background:var(--c);color:#fff}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0;align-items:center}
input,select,textarea{font:inherit;padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink);max-width:100%}
#q{flex:1;min-width:220px}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;cursor:pointer}.chk input{width:18px;height:18px;padding:0}
.gl{display:flex;align-items:baseline;gap:8px;margin:22px 0 8px;font-size:.78rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.gl::after{content:"";flex:1;height:2px;background:var(--line)}
.gl b{color:var(--ink);font-size:.95rem;letter-spacing:0;text-transform:none}
.r{--c:#888;background:#fff;border-radius:12px;margin-bottom:8px;box-shadow:0 1px 6px rgba(11,61,145,.08);overflow:hidden}
.main{display:grid;grid-template-columns:1fr auto auto;gap:10px 14px;align-items:center;padding:12px 16px;cursor:pointer}
.main:hover{background:#f8fbff}
.ti{font-weight:700;display:flex;align-items:center;gap:10px;min-width:0}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.ti span.t{overflow:hidden;text-overflow:ellipsis}
.chip{--c:#888;font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);white-space:nowrap}
.stsel{font-weight:700;font-size:.86rem;padding:6px 10px;border-radius:99px;border:2px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);cursor:pointer}
.bar{height:5px;background:var(--line)}.bar i{display:block;height:100%;background:var(--c);transition:width .5s}
.r.done .t{color:var(--mut);text-decoration:line-through}
.more{display:none;padding:12px 16px 14px;border-top:1px solid var(--line);background:#fafcff}
.r.open .more{display:block}
.more .d{color:var(--ink);white-space:pre-wrap;margin:0 0 8px}.more .none{color:var(--mut);font-style:italic}
.dates{font-size:.82rem;color:var(--mut);margin-bottom:8px}
.att a{color:var(--brand);cursor:pointer;text-decoration:underline;margin-right:12px;font-size:.88rem}
.act{display:flex;gap:8px;margin-top:10px}
.empty{text-align:center;color:var(--mut);padding:50px 20px;background:#fff;border-radius:14px;margin-top:14px}
dialog{border:0;border-radius:18px;padding:24px;width:min(560px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(11,40,91,.55)}
dialog h2{margin:0 0 14px}
dialog label{display:block;font-size:.82rem;font-weight:700;margin:10px 0 4px}
dialog input:not([type=checkbox]),dialog select,dialog textarea{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dact{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.plist{margin:14px 0;padding:0;list-style:none}
.plist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#14284b;color:#fff;padding:10px 18px;border-radius:12px;font-size:.9rem;z-index:50;display:none}
#toast.err{background:#c0392b}
@media(max-width:640px){.main{grid-template-columns:1fr auto}.main .chip{display:none}.row2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
<a class="back" href="index.html">← Retour aux entretiens</a>
<div class="hrow">
 <h1>Mes tâches</h1>
 <button class="btn w" id="new">+ Nouvelle tâche</button>
 <details class="menu" id="menu"><summary>⚙ Réglages</summary><div><button id="adm">Prestataires</button><button id="sadm">Statuts</button></div></details>
</div>
</div></header>

<main class="wrap">
 <nav class="tabs" id="tabs" aria-label="Rubriques"></nav>
 <div class="filters">
  <label for="q" hidden>Recherche</label><input id="q" type="search" placeholder="🔍 Rechercher une tâche, un prestataire, un fichier…">
  <select id="fp" aria-label="Prestataire"></select>
  <select id="fs" aria-label="Statut"></select>
  <label class="chk"><input type="checkbox" id="tgl"><span id="tgll">Afficher les terminées</span></label>
 </div>
 <div id="list"></div>
</main>

<dialog id="dt"><form method="dialog" id="ft">
<h2 id="dtt">Nouvelle tâche</h2>
<label for="f_title">Titre *</label><input id="f_title" required>
<div class="row2"><div><label for="f_cat">Rubrique</label><select id="f_cat"></select></div>
<div><label for="f_prov">Prestataire</label><select id="f_prov"></select></div></div>
<label for="f_st">Statut</label><select id="f_st"></select>
<label for="f_desc">Description</label><textarea id="f_desc" rows="4"></textarea>
<label for="f_files">Pièces jointes</label><input id="f_files" type="file" multiple>
<div id="f_att" class="att" style="margin-top:8px"></div>
<div class="dact"><button type="button" class="btn alt" id="cancel">Annuler</button><button class="btn" id="save" type="submit">Enregistrer</button></div>
</form></dialog>

<dialog id="dp">
<h2>Prestataires</h2>
<div class="row2"><div><label for="p_name">Nom *</label><input id="p_name" placeholder="Ex. Dell, Orange…"></div><div><label for="p_ct">Contact</label><input id="p_ct" placeholder="Nom, e-mail ou téléphone"></div></div>
<div class="dact" style="margin-top:10px"><button class="btn" id="padd">Ajouter</button></div>
<ul class="plist" id="plist"></ul>
<div class="dact"><button class="btn alt" id="pclose">Fermer</button></div>
</dialog>

<dialog id="ds">
<h2>Statuts</h2>
<div class="row2"><div><label for="s_name">Nom *</label><input id="s_name" placeholder="Ex. Devis reçu, Annulé…"></div><div><label for="s_col">Couleur</label><input id="s_col" type="color" value="#0891b2" style="height:42px;padding:3px"></div></div>
<label style="display:flex;gap:8px;align-items:flex-start;font-weight:600;font-size:.85rem;margin-top:12px"><input type="checkbox" id="s_closed" style="margin-top:4px"> Statut de clôture : la tâche quitte la liste et reçoit une date de clôture</label>
<div class="dact" style="margin-top:10px"><button class="btn" id="sadd">Ajouter</button></div>
<ul class="plist" id="slist"></ul>
<div class="dact"><button class="btn alt" id="sclose">Fermer</button></div>
</dialog>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* Mêmes valeurs que dans index.html */
const SUPABASE_URL = "https://VOTRE-PROJET.supabase.co";
const SUPABASE_ANON_KEY = "VOTRE_CLE_ANON_PUBLIQUE";
const BUCKET="task-files";
const CAT=[["Devis et Commandes","#2563eb"],["Matériel en interne","#059669"],["Yooz","#d97706"],["Autres tâches","#db2777"]];
const DEF=[["À faire","#64748b",10,false],["En cours","#2563eb",20,false],["En attente","#f59e0b",30,false],["Attente livraison","#8b5cf6",40,false],["Terminé","#10b981",1000,true]].map(a=>({id:null,name:a[0],color:a[1],ord:a[2],is_closed:a[3]}));
let ST=[],SR=[];
function buildST(rows){SR=rows;const nc=rows.filter(r=>!r.is_closed);ST=rows.map(r=>[r.name,r.is_closed?100:Math.round(nc.indexOf(r)/nc.length*100),r.color,r.is_closed]);}
buildST(DEF);

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const fmt=d=>d?new Date(d).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"}):"–";
const stI=n=>Math.max(0,ST.findIndex(s=>s[0]===n));
const cl=t=>!!ST[stI(t.status)][3];
let sb,tasks=[],provs=[],cat="all",edit=null,rm=[],showClosed=false,warned=false,opened=new Set();

function toast(m,err){const t=$("#toast");t.textContent=m;t.className=err?"err":"";t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",err?5000:2200);}
const pname=id=>(provs.find(p=>p.id===id)||{}).name||"";

async function load(){
 const [t,p,sr]=await Promise.all([sb.from("tasks").select("*").order("created_at",{ascending:false}),sb.from("providers").select("*"),sb.from("statuses").select("*").order("ord")]);
 if(t.error||p.error){toast("Erreur de chargement : "+(t.error||p.error).message,true);return;}
 if(sr.error||!sr.data.length){buildST(DEF);if(!warned){warned=true;toast("Table des statuts absente : exécutez supabase_statuts.sql",true);}}else buildST(sr.data);
 tasks=t.data;provs=p.data.sort((a,b)=>a.name.localeCompare(b.name,"fr",{sensitivity:"base"}));fillSel();render();
}
function fillSel(){
 const fp=$("#fp").value,fs=$("#fs").value;
 $("#fp").innerHTML='<option value="">Tous les prestataires</option>'+provs.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");
 $("#fs").innerHTML='<option value="">Tous les statuts</option>'+ST.map(s=>`<option>${esc(s[0])}</option>`).join("");
 $("#fp").value=fp;$("#fs").value=fs;
 $("#f_cat").innerHTML=CAT.map(c=>`<option>${c[0]}</option>`).join("");
 $("#f_st").innerHTML=ST.map(s=>`<option>${esc(s[0])}</option>`).join("");
 $("#f_prov").innerHTML='<option value="">— Aucun —</option>'+provs.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");
}
function match(t){
 const q=$("#q").value.trim().toLowerCase(),fp=$("#fp").value,fs=$("#fs").value;
 if(fp&&t.provider_id!==fp)return false;if(fs&&t.status!==fs)return false;
 return !q||[t.title,t.description,pname(t.provider_id),t.category,t.status,(t.attachments||[]).map(a=>a.name).join(" ")].join(" ").toLowerCase().includes(q);
}
function render(){
 const inCat=tasks.filter(t=>cat==="all"||t.category===cat);
 $("#tgll").textContent=`Afficher les terminées (${inCat.filter(cl).length})`;
 $("#tabs").innerHTML=[["all","Toutes","#0f5fd7"]].concat(CAT.map(c=>[c[0],c[0],c[1]])).map(([id,n,c])=>`<button class="tab" style="--c:${c}" data-id="${id}" aria-pressed="${cat===id}">${n}<small>${tasks.filter(t=>(id==="all"||t.category===id)&&!cl(t)).length}</small></button>`).join("");
 document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cat=b.dataset.id;render();});
 const fs=$("#fs").value;
 const rows=inCat.filter(t=>(showClosed||!cl(t)||t.status===fs)&&match(t));
 /* Regroupement par prestataire (A→Z), « Sans prestataire » en dernier ; tâches ouvertes avant les terminées */
 const g={};rows.forEach(t=>(g[t.provider_id||""]=g[t.provider_id||""]||[]).push(t));
 const keys=Object.keys(g).sort((a,b)=>!a?1:!b?-1:pname(a).localeCompare(pname(b),"fr",{sensitivity:"base"}));
 $("#list").innerHTML=keys.length?keys.map(k=>{
  const arr=g[k].sort((a,b)=>(+cl(a))-(+cl(b))||new Date(b.created_at)-new Date(a.created_at));
  return `<div class="gl"><b>${esc(k?pname(k):"Sans prestataire")}</b> ${arr.length}</div>${arr.map(row).join("")}`;
 }).join(""):`<div class="empty">${tasks.length?"Aucune tâche ne correspond à votre recherche.":"Aucune tâche pour l’instant.<br>Cliquez sur « + Nouvelle tâche » pour commencer."}</div>`;
 document.querySelectorAll(".main").forEach(m=>m.onclick=e=>{if(e.target.closest("select"))return;const r=m.parentElement,id=r.dataset.id;r.classList.toggle("open");r.classList.contains("open")?opened.add(id):opened.delete(id);});
 document.querySelectorAll(".stsel").forEach(s=>s.onchange=()=>setStatus(s.dataset.id,s.value));
 document.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>openForm(tasks.find(t=>t.id===b.dataset.ed)));
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>delTask(b.dataset.del));
 document.querySelectorAll("[data-file]").forEach(a=>a.onclick=()=>openFile(a.dataset.file));
}
function row(t){
 const s=ST[stI(t.status)],c=(CAT.find(x=>x[0]===t.category)||[0,"#64748b"])[1];
 return `<article class="r ${s[3]?"done":""} ${opened.has(t.id)?"open":""}" data-id="${t.id}" style="--c:${s[2]}">
 <div class="main"><div class="ti"><span class="dot"></span><span class="t">${esc(t.title)}</span></div>
  <span class="chip" style="--c:${c}">${esc(t.category)}</span>
  <select class="stsel" data-id="${t.id}" aria-label="Statut">${ST.map(x=>`<option${x[0]===t.status?" selected":""}>${esc(x[0])}</option>`).join("")}</select></div>
 <div class="bar"><i style="width:${s[1]||3}%"></i></div>
 <div class="more"><div class="dates">Créée le ${fmt(t.created_at)} · Clôturée le ${fmt(t.closed_at)}</div>
  ${t.description?`<p class="d">${esc(t.description)}</p>`:'<p class="d none">Pas de description.</p>'}
  <div class="att">${(t.attachments||[]).map(a=>`<a data-file="${esc(a.path)}">📎 ${esc(a.name)}</a>`).join("")}</div>
  <div class="act"><button class="btn alt sm" data-ed="${t.id}">Modifier</button><button class="btn red sm" data-del="${t.id}">Supprimer</button></div></div></article>`;
}
async function setStatus(id,status){
 const {data,error}=await sb.from("tasks").update({status}).eq("id",id).select().single();
 if(error){toast("Échec : "+error.message,true);return render();}
 tasks=tasks.map(t=>t.id===id?data:t);render();
 if(ST[stI(status)][3])toast("Tâche terminée : masquée de la liste (case « Afficher les terminées »)");
}
async function openFile(path){
 const {data,error}=await sb.storage.from(BUCKET).createSignedUrl(path,120);
 if(error)return toast("Fichier inaccessible : "+error.message,true);window.open(data.signedUrl,"_blank","noopener");
}
async function delTask(id){
 const t=tasks.find(x=>x.id===id);if(!confirm(`Supprimer la tâche « ${t.title} » ?`))return;
 const paths=(t.attachments||[]).map(a=>a.path);if(paths.length)await sb.storage.from(BUCKET).remove(paths);
 const {error}=await sb.from("tasks").delete().eq("id",id);
 if(error)return toast("Suppression impossible : "+error.message,true);
 tasks=tasks.filter(x=>x.id!==id);render();toast("Tâche supprimée");
}

/* Formulaire tâche */
function openForm(t){
 edit=t||null;rm=[];$("#ft").reset();$("#dtt").textContent=t?"Modifier la tâche":"Nouvelle tâche";
 $("#f_title").value=t?.title||"";$("#f_cat").value=t?.category||(cat==="all"?CAT[0][0]:cat);$("#f_prov").value=t?.provider_id||"";
 $("#f_st").value=t?.status||ST[0][0];$("#f_desc").value=t?.description||"";drawAtt();$("#dt").showModal();
}
function drawAtt(){
 const a=(edit?.attachments||[]).filter(x=>!rm.includes(x.path));
 $("#f_att").innerHTML=a.map(x=>`<span style="margin-right:12px">📎 ${esc(x.name)} <a data-rm="${esc(x.path)}" title="Retirer">✕</a></span>`).join("");
 document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{rm.push(b.dataset.rm);drawAtt();});
}
$("#ft").onsubmit=async e=>{
 e.preventDefault();$("#save").disabled=true;
 const row={title:$("#f_title").value.trim(),category:$("#f_cat").value,provider_id:$("#f_prov").value||null,status:$("#f_st").value,description:$("#f_desc").value};
 try{
  let id=edit?.id,att=(edit?.attachments||[]).filter(x=>!rm.includes(x.path));
  if(edit){const r=await sb.from("tasks").update(row).eq("id",id);if(r.error)throw r.error;}
  else{const r=await sb.from("tasks").insert(row).select("id").single();if(r.error)throw r.error;id=r.data.id;opened.add(id);}
  for(const f of $("#f_files").files){
   const path=`${id}/${Date.now()}_${f.name.replace(/[^\w.\-]+/g,"_")}`;
   const u=await sb.storage.from(BUCKET).upload(path,f);if(u.error)throw u.error;att.push({name:f.name,path});
  }
  if(rm.length)await sb.storage.from(BUCKET).remove(rm);
  const r2=await sb.from("tasks").update({attachments:att}).eq("id",id);if(r2.error)throw r2.error;
  $("#dt").close();toast("Tâche enregistrée ✓");await load();
 }catch(err){toast("Échec : "+err.message,true);}
 $("#save").disabled=false;
};
$("#cancel").onclick=()=>$("#dt").close();
$("#new").onclick=()=>openForm(null);

/* Prestataires */
function drawProv(){
 $("#plist").innerHTML=provs.length?provs.map(p=>`<li><span><b>${esc(p.name)}</b>${p.contact?` <small style="color:var(--mut)">· ${esc(p.contact)}</small>`:""}<br><small style="color:var(--mut)">${tasks.filter(t=>t.provider_id===p.id).length} tâche(s)</small></span><span><button class="btn alt sm" data-pr="${p.id}">Renommer</button> <button class="btn red sm" data-pd="${p.id}">Supprimer</button></span></li>`).join(""):"<li>Aucun prestataire.</li>";
 document.querySelectorAll("[data-pr]").forEach(b=>b.onclick=async()=>{const p=provs.find(x=>x.id===b.dataset.pr),n=prompt("Nouveau nom :",p.name);if(!n||!n.trim())return;const r=await sb.from("providers").update({name:n.trim()}).eq("id",p.id);if(r.error)return toast(r.error.message,true);await load();drawProv();});
 document.querySelectorAll("[data-pd]").forEach(b=>b.onclick=async()=>{const p=provs.find(x=>x.id===b.dataset.pd);if(!confirm(`Supprimer « ${p.name} » ? Les tâches liées resteront, sans prestataire.`))return;const r=await sb.from("providers").delete().eq("id",p.id);if(r.error)return toast(r.error.message,true);await load();drawProv();});
}
$("#adm").onclick=()=>{$("#menu").open=false;drawProv();$("#dp").showModal();};
$("#pclose").onclick=()=>$("#dp").close();
$("#padd").onclick=async()=>{
 const name=$("#p_name").value.trim();if(!name)return toast("Saisissez un nom",true);
 const r=await sb.from("providers").insert({name,contact:$("#p_ct").value.trim()});
 if(r.error)return toast(r.error.code==="23505"?"Ce prestataire existe déjà":r.error.message,true);
 $("#p_name").value=$("#p_ct").value="";await load();drawProv();toast("Prestataire ajouté ✓");
};

/* Statuts */
function drawSt(){
 $("#slist").innerHTML=SR.map(r=>`<li><span><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${esc(r.color)};margin-right:8px"></span><b>${esc(r.name)}</b>${r.is_closed?' <small style="color:var(--mut)">· clôture</small>':""}<br><small style="color:var(--mut)">${tasks.filter(t=>t.status===r.name).length} tâche(s)</small></span><button class="btn red sm" data-sd="${r.id}">Supprimer</button></li>`).join("");
 document.querySelectorAll("[data-sd]").forEach(b=>b.onclick=async()=>{
  const r=SR.find(x=>x.id===b.dataset.sd);if(!r)return;
  if(tasks.some(t=>t.status===r.name))return toast("Impossible : des tâches utilisent encore ce statut.",true);
  if(SR.filter(x=>x.is_closed===r.is_closed).length<2)return toast(r.is_closed?"Conservez au moins un statut de clôture.":"Conservez au moins un statut de travail.",true);
  if(!confirm(`Supprimer le statut « ${r.name} » ?`))return;
  const d=await sb.from("statuses").delete().eq("id",r.id);if(d.error)return toast(d.error.message,true);
  await load();drawSt();
 });
}
$("#sadm").onclick=()=>{$("#menu").open=false;drawSt();$("#ds").showModal();};
$("#sclose").onclick=()=>$("#ds").close();
$("#sadd").onclick=async()=>{
 const name=$("#s_name").value.trim(),closed=$("#s_closed").checked;if(!name)return toast("Saisissez un nom",true);
 if(!SR[0]||!SR[0].id)return toast("Exécutez d’abord supabase_statuts.sql",true);
 const pool=closed?SR:SR.filter(x=>!x.is_closed),ord=Math.max(0,...pool.map(x=>x.ord))+10;
 const a=await sb.from("statuses").insert({name,color:$("#s_col").value,ord,is_closed:closed});
 if(a.error)return toast(a.error.code==="23505"?"Ce statut existe déjà":a.error.message,true);
 $("#s_name").value="";$("#s_closed").checked=false;await load();drawSt();toast("Statut ajouté ✓");
};
